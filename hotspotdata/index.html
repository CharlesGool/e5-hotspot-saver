<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
	html, body { margin: 0; background: #0b0e13; color: #e8ecf2;
		font-family: "Noto Sans CJK SC", "DejaVu Sans", sans-serif; user-select: none; cursor: none; }
	body { padding: 8px; }
	.card { background: #161b23; border-radius: 10px; padding: 9px 11px; margin-bottom: 7px; }
	.row { display: flex; justify-content: space-between; align-items: baseline; }
	.row + .row { margin-top: 6px; }
	.sub { color: #8b95a5; font-size: 12px; line-height: 1.5; }
	.val { font-weight: bold; }
	.good { color: #3ccf7a; } .fair { color: #f2c14b; } .off { color: #8b95a5; } .poor { color: #f0625a; }
	button { font: inherit; color: #e8ecf2; background: #232a35; border: 0; border-radius: 8px;
		padding: 9px; width: 100%; outline: none; }
	button:focus { box-shadow: 0 0 0 2px #fff; }
</style>
</head>
<body>
<div class="card" id="state"></div>
<button id="toggle"></button>
<div class="sub" id="note" style="margin-top:7px"></div>
<script src="/sdk/e5.js"></script>
<script>
'use strict';
// 热点省电 (the hotspotdata app): the saving runs in the background service;
// this page shows it and turns it on and off.  Settings: 高级 -> 热点省电.
const $ = (id) => document.getElementById(id);
let st = null, busy = false, loadError = null;

function esc(s) {
	return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function row(label, text, cls) {
	return `<div class="row"><span>${label}</span><span class="val ${cls}">${text}</span></div>`;
}

function draw() {
	if (!st) {
		// (a backend that fails says why, instead of loading for ever)
		$('state').innerHTML = loadError
			? `<div class="sub poor">${e5.t({ zh: '读取失败：', en: 'Cannot load: ' })}${esc(loadError)}</div>`
			: `<div class="sub">${e5.t({ zh: '读取中…', en: 'Loading…' })}</div>`;
		return;
	}
	const h = st.hotspot, d = st.data;
	const data = d.up ? [e5.t({ zh: '已连接', en: 'Connected' }), 'good']
		: d.pending ? [e5.t({ zh: '连接中', en: 'Connecting' }), 'fair']
		: [e5.t({ zh: '已断开', en: 'Off' }), 'off'];
	// The card's radio as the AT owner reads it (the status bar's source);
	// ModemManager's state only while that reading is unavailable: its
	// "disabled" does not mean the radio is off on this modem.
	const r = st.radio ?? {}, m = st.modem;
	const sim = r.card == null ? '' : ` · SIM ${r.card + 1}`;
	const cell = r.known
		? (r.off ? [e5.t({ zh: '射频已关闭', en: 'Radio off' }) + sim +
				(r.paused ? e5.t({ zh: ' · 轮询暂停', en: ' · polling paused' }) : ''), 'off']
			: [[r.operator, r.label].filter(Boolean).map(esc).join(' ') || e5.t({ zh: '射频开启', en: 'Radio on' }), 'good'])
		: m == null ? [e5.t({ zh: '无基带', en: 'No modem' }), 'poor']
		: [e5.t({ zh: '读取中', en: 'Reading' }) + ` (MM ${esc(m)})`, 'fair'];
	$('state').innerHTML =
		row(e5.t({ zh: '省电', en: 'Saving' }),
			st.enabled ? e5.t({ zh: '开启', en: 'On' }) : e5.t({ zh: '关闭', en: 'Off' }), st.enabled ? 'good' : 'off') +
		row(e5.t({ zh: '热点', en: 'Hotspot' }),
			!h.available ? e5.t({ zh: '未配置', en: 'None' }) : h.on ? e5.t({ zh: '开启', en: 'On' }) : e5.t({ zh: '关闭', en: 'Off' }),
			h.on ? 'good' : 'off') +
		row(e5.t({ zh: '移动数据', en: 'Mobile data' }), data[0], data[1]) +
		row(e5.t({ zh: '蜂窝', en: 'Cellular' }), cell[0], cell[1]) +
		row(e5.t({ zh: 'CPU / GPU', en: 'CPU / GPU' }),
			st.boosted ? e5.t({ zh: '屏幕亮着，临时全速', en: 'Full speed, screen lit' })
				: st.perf_low ? e5.t({ zh: '锁最低频率', en: 'Lowest clocks' }) : e5.t({ zh: '正常', en: 'Normal' }),
			st.perf_low ? 'off' : 'good') +
		row(e5.t({ zh: '蓝牙', en: 'Bluetooth' }),
			st.bt_off ? e5.t({ zh: '已随热点关闭', en: 'Off with the hotspot' }) : e5.t({ zh: '未改动', en: 'Untouched' }),
			st.bt_off ? 'off' : 'good') +
		row(e5.t({ zh: '熄屏刷新', en: 'Dark refresh' }),
			st.blank_poll ? e5.t({ zh: `每 ${st.blank_poll / 1000} 秒`, en: `every ${st.blank_poll / 1000} s` })
				: e5.t({ zh: '每 5 秒（原样）', en: 'every 5 s' }), st.blank_poll ? 'off' : 'good') +
		row(e5.t({ zh: 'CPU 核心', en: 'CPU cores' }),
			(st.cores_off > 0 ? e5.t({ zh: `已关 ${st.cores_off} 个`, en: `${st.cores_off} off` }) + ' · ' : '') +
			e5.t({ zh: '在线 ', en: 'online ' }) + esc(st.cores_online ?? '--'), st.cores_off > 0 ? 'off' : 'good') +
		row(e5.t({ zh: '后台服务', en: 'Service' }),
			st.service ? e5.t({ zh: '运行中', en: 'Running' }) : e5.t({ zh: '未运行', en: 'Stopped' }), st.service ? 'good' : 'poor');
	$('toggle').textContent = st.enabled ? e5.t({ zh: '关闭省电', en: 'Turn saving off' })
		: e5.t({ zh: '开启省电', en: 'Turn saving on' });
	const what = st.mode == 'radio'
		? e5.t({ zh: '关闭蜂窝（收不到短信电话）', en: 'cellular goes off (no SMS or calls)' })
		: e5.t({ zh: '断开数据（短信电话正常）', en: 'data goes off (SMS and calls work)' });
	const when = st.off_delay > 0
		? e5.t({ zh: `关热点 ${st.off_delay} 分钟后`, en: `${st.off_delay} min after the hotspot goes off, ` })
		: e5.t({ zh: '关热点后立即', en: 'When the hotspot goes off, ' });
	const idle = st.idle_off > 0
		? e5.t({ zh: `热点 ${st.idle_off} 分钟没有设备连接会自动关闭（USB 连着电脑时不关）。`,
			en: `The hotspot turns itself off after ${st.idle_off} min without a device (not with a computer on USB). ` })
		: '';
	$('note').textContent = st.enabled
		? when + what + e5.t({ zh: '；开热点时自动恢复。', en: '; turning it on brings it back. ' }) + idle +
			e5.t({ zh: '各项设置在 高级 → 热点省电。', en: 'Settings: Advanced -> Hotspot Power Saver.' })
		: e5.t({ zh: '省电已关闭，热点关闭后一切照常。', en: 'Saving is off: nothing changes with the hotspot.' });
}

async function load() {
	try { st = await e5.api('/status'); loadError = null; }
	catch (e) { loadError = e.message || String(e); if (st) e5.toast(loadError); }
	draw();
}

async function toggle() {
	if (busy || !st) return;
	busy = true;
	try { st = await e5.api('/enabled', { body: { on: !st.enabled } }); }
	catch (e) { e5.toast(e.message); }
	busy = false;
	draw();
}

e5.onKey((k) => {
	if (k.kind == 'ok') { toggle(); return true; }
	return false;
});
$('toggle').addEventListener('click', toggle);
draw();
load();
setInterval(load, 3000);
</script>
</body>
</html>
